user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SRE-grade JSON analytics format with microsecond request and upstream timing
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log  /var/log/nginx/access.log  json_analytics;

    sendfile        on;
    keepalive_timeout  65;

    upstream shop_api_backend {
        server shop-api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static storefront
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API endpoints with precise timing headers
        location /api/ {
            proxy_pass http://shop_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Proxy Healthcheck
        location /health {
            proxy_pass http://shop_api_backend/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Proxy internal fault endpoints
        location /internal/ {
            proxy_pass http://shop_api_backend;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}

