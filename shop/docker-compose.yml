version: '3.8'

services:
  shop-nginx:
    image: nginx:alpine
    container_name: shop-nginx
    restart: unless-stopped
    ports:
      - "5001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - shop-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  shop-api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: shop-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      - DB_HOST=shop-postgres
      - DB_PORT=5432
      - DB_NAME=shopdb
      - DB_USER=postgres
      - DB_PASSWORD=shoppassword
      - REDIS_HOST=shop-redis
      - REDIS_PORT=6379
    depends_on:
      - shop-postgres
      - shop-redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  shop-postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    restart: unless-stopped
    command: postgres -c max_connections=100 -c shared_buffers=64MB
    environment:
      - POSTGRES_DB=shopdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=shoppassword
    ports:
      - "5433:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

  shop-redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"

