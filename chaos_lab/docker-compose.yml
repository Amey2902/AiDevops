version: '3.8'

services:
  chaos-target:
    build: .
    container_name: checkout-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      # If running on the same machine with Docker, host.docker.internal reaches the host DevOpsAI
      # If running on AWS EC2, replace with your DevOpsAI public domain or ngrok URL
      - DEVOPSAI_WEBHOOK_URL=http://host.docker.internal:8000/api/webhook/
      - SERVICE_NAME=checkout-api
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

